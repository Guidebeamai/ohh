name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate schema, examples and failing fixtures
        run: npm test

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links between repository files
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: --offline --no-progress --include-fragments './**/*.md' './site/*.html'
          fail: true
